name: Keepalive

# GitHub disables scheduled workflows after 60 days without repository activity, with no warning (D10).
# Enabling a workflow through the API restarts that clock without making fake commits. The keepalive
# workflow is scheduled too, so it enables itself as well.
on:
  schedule:
    - cron: "23 4 1 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-enable the scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in run.yml keepalive.yml; do
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
            echo "Enabled ${workflow}"
          done